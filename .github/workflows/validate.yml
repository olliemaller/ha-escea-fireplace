name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  # The Marketplace catalogue only accepts a clean run: no ignored checks.
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: tests (Home Assistant ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: "2025.8"
            python: "3.13"
            install: '"homeassistant==2025.8.3" pytest-homeassistant-custom-component "pycares<5"'
          # Home Assistant 2026.3 and later need Python 3.14.
          - ha: latest
            python: "3.14"
            install: pytest-homeassistant-custom-component
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ${{ matrix.install }} ruff mypy pytest-cov
      - name: Install the integration's requirements
        # No fallback: if the pinned aioescea isn't on PyPI, this fails, because
        # Home Assistant couldn't install it either.
        run: |
          reqs=$(python -c "import json;print(' '.join(json.load(open('custom_components/escea_fireplace/manifest.json'))['requirements']))")
          pip install $reqs
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - name: Type check
        if: matrix.ha == 'latest'
        run: mypy --strict --implicit-reexport --ignore-missing-imports custom_components/escea_fireplace
      - run: pytest -q --cov=custom_components.escea_fireplace --cov-report=term-missing --cov-fail-under=95
